<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- __BRAND__ is replaced by nginx (sub_filter) with the brand of the current
         domain: link previews and crawlers do not run the Compose bundle. -->
    <meta name="description" content="__BRAND__ — доставка еды. Закажите вкусные блюда с доставкой на дом.">
    <meta name="theme-color" content="#FF8243">
    <title>__BRAND__ — доставка еды</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="__BRAND__">
    <meta property="og:title" content="__BRAND__ — доставка еды">
    <meta property="og:description" content="Закажите вкусные блюда с доставкой на дом.">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Match the Compose surface color so there is no white flash before the
           app finishes loading (light/dark follow the system theme). */
        body {
            background-color: #FFFFFF;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #25252F;
            }
        }
    </style>
</head>
<body>
<script src="papakarlo-web.js"></script>
</body>
</html>

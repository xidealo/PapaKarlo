<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Условия предоставления услуг сервиса доставки еды.">
    <meta name="theme-color" content="#FF8243">
    <title>Условия предоставления услуг</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        body {
            color: #25252F;
            background-color: #FFFFFF;
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            box-sizing: border-box;
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 16px 48px;
        }
        h1 {
            font-size: 24px;
            line-height: 1.3;
            margin: 0 0 16px;
        }
        .back {
            display: inline-block;
            margin-top: 32px;
            color: inherit;
        }
        @media (prefers-color-scheme: dark) {
            body {
                color: #FFFFFF;
                background-color: #25252F;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Условия предоставления услуг</h1>
    <p>Текст документа будет опубликован позже.</p>
    <a class="back" href="/">Вернуться на сайт</a>
</main>
</body>
</html>

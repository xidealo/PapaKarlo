<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Доставка еды. Закажите вкусные блюда с доставкой на дом.">
    <meta name="theme-color" content="#FF8243">
    <title>Доставка еды</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Доставка еды">
    <meta property="og:title" content="Доставка еды">
    <meta property="og:description" content="Закажите вкусные блюда с доставкой на дом.">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Match the Compose surface color so there is no white flash before the
           app finishes loading (light/dark follow the system theme). */
        body {
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
        }
        /* min-height: 0 lets this flex item shrink below its content size,
           otherwise the canvas keeps its intrinsic height and pushes the footer
           out of the viewport. */
        #compose-root {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
        }
        .site-footer {
            flex: 0 0 auto;
            box-sizing: border-box;
            width: 100%;
            padding: 12px 16px;
            font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #25252F;
            background-color: #F3F3F5;
            border-top: 1px solid #E0E0E5;
        }
        .site-footer nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
        }
        .site-footer a {
            color: inherit;
        }
        .site-footer p {
            margin: 8px 0 0;
            opacity: 0.7;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #25252F;
            }
            .site-footer {
                color: #FFFFFF;
                background-color: #1D1D25;
                border-top-color: #37374A;
            }
        }
    </style>
</head>
<body>
<div id="compose-root"></div>
<footer class="site-footer">
    <nav>
        <a href="/user-agreement.html">Пользовательское соглашение</a>
        <a href="/privacy-policy.html">Политика конфиденциальности</a>
        <a href="/terms-of-service.html">Условия предоставления услуг</a>
    </nav>
    <p>© 2026</p>
</footer>
<script src="papakarlo-web.js"></script>
</body>
</html>

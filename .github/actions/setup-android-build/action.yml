name: Setup Android build
description: JDK 21, Android SDK with API 37.0, Gradle

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - name: Ensure Android API 37.0 platform
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        if [ -z "$SDK" ]; then
          echo "::error::ANDROID_SDK_ROOT / ANDROID_HOME is not set"
          exit 1
        fi
        echo "ANDROID_SDK_ROOT=$SDK"
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager --install "platforms;android-37.0"
        if [ ! -d "$SDK/platforms/android-37.0" ]; then
          echo "::error::Android SDK platform 37.0 is missing after install"
          ls -la "$SDK/platforms" || true
          exit 1
        fi
        if [ ! -e "$SDK/platforms/android-37" ]; then
          ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
        fi
        ls -la "$SDK/platforms"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

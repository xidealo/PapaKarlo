server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;

    # Cache hashed Vite assets aggressively; HTML stays fresh.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: serve the file if it exists, otherwise fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
